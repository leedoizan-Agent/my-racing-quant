name: Agent E Post-Race Attribution System

on:
  schedule:
    - cron: '15 15 * * *'  # 夜賽 23:15 HKT
    - cron: '20 10 * * *'  # 日賽 18:20 HKT
  workflow_dispatch:
    inputs:
      target_date:
        description: '賽事日期 (YYYY-MM-DD)'
        required: true
        default: '2026-10-14'
      venue:
        description: '賽事場地 (HV 或 ST)'
        required: true
        default: 'HV'

jobs:
  run-agent-e-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install supabase beautifulsoup4 requests numpy pandas

      - name: Run Attribution Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '2026-10-14' }}
          RACE_VENUE: ${{ github.event.inputs.venue || 'HV' }}
        run: |
          python scripts/agent_e_attribution.py
