name: Agent E Post-Race Attribution System

on:
  schedule:
    # UTC 時間 = 香港時間 - 8 小時
    # 每週三 UTC 15:15 (香港時間 23:15 谷草夜賽結算)
    - cron: '15 15 * * 3'
    # 每週日 UTC 10:00 (香港時間 18:00 沙田日賽結算)
    - cron: '0 10 * * 0'
  # 允許在 GitHub 介面手動按鈕觸發
  workflow_dispatch:
    inputs:
      venue:
        description: '賽事場地 (HV 或 ST)'
        required: true
        default: 'HV'

jobs:
  run-agent-e-attribution:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout Code)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 Agent E 賽後歸因與 Discord 推播
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RACE_VENUE: ${{ github.event.inputs.venue || 'HV' }}
        run: |
          python scripts/agent_e_attribution.py
