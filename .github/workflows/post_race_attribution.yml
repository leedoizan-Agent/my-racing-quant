name: Agent E Post-Race Attribution System

on:
  schedule:
    # 每週三 UTC 15:15 (香港時間 23:15 谷草夜賽)
    - cron: '15 15 * * 3'
    # 每週三 UTC 16:00 (香港時間 24:00 谷草夜賽備援防漏)
    - cron: '0 16 * * 3'
    # 每週日 UTC 10:00 (香港時間 18:00 沙田日賽)
    - cron: '0 10 * * 0'
    # 每週日 UTC 11:00 (香港時間 19:00 沙田日賽備援防漏)
    - cron: '0 11 * * 0'
  workflow_dispatch:
    inputs:
      venue:
        description: '賽事場地 (ST 或 HV)'
        required: true
        default: 'ST'

jobs:
  run-agent-e-attribution:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 Agent E 賽後歸因與 Discord 推播
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: "https://bqmnfoecwmsrlxegscap.supabase.co"
          SUPABASE_KEY: "sb_publishable_s9savKYITCSHuspOkLyLFg_HgRNwb2d"
          RACE_VENUE: ${{ github.event.inputs.venue || 'ST' }}
        run: |
          python scripts/agent_e_attribution.py
